<svg width="800" height="400" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="400" fill="#0a0a0a"/>
  
  <!-- Grid pattern -->
  <defs>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#00ff88" stroke-width="0.5" opacity="0.2"/>
    </pattern>
  </defs>
  <rect width="800" height="400" fill="url(#grid)"/>
  
  <!-- Title area -->
  <rect x="50" y="50" width="700" height="80" fill="#1a1a1a" stroke="#00ff88" stroke-width="2" rx="8"/>
  <text x="400" y="100" text-anchor="middle" fill="#00ff88" font-family="Arial, sans-serif" font-size="32" font-weight="bold">PixelPunk v1.0.0</text>
  
  <!-- Feature boxes -->
  <rect x="50" y="160" width="200" height="100" fill="#1a1a1a" stroke="#00ff88" stroke-width="1" rx="4"/>
  <text x="150" y="185" text-anchor="middle" fill="#00ff88" font-family="Arial, sans-serif" font-size="14" font-weight="bold">图片管理</text>
  <text x="150" y="205" text-anchor="middle" fill="#888" font-family="Arial, sans-serif" font-size="12">完整的图片上传</text>
  <text x="150" y="220" text-anchor="middle" fill="#888" font-family="Arial, sans-serif" font-size="12">和管理功能</text>
  
  <rect x="300" y="160" width="200" height="100" fill="#1a1a1a" stroke="#00ff88" stroke-width="1" rx="4"/>
  <text x="400" y="185" text-anchor="middle" fill="#00ff88" font-family="Arial, sans-serif" font-size="14" font-weight="bold">AI 分析</text>
  <text x="400" y="205" text-anchor="middle" fill="#888" font-family="Arial, sans-serif" font-size="12">基础 AI 图片分析</text>
  <text x="400" y="220" text-anchor="middle" fill="#888" font-family="Arial, sans-serif" font-size="12">和标签生成</text>
  
  <rect x="550" y="160" width="200" height="100" fill="#1a1a1a" stroke="#00ff88" stroke-width="1" rx="4"/>
  <text x="650" y="185" text-anchor="middle" fill="#00ff88" font-family="Arial, sans-serif" font-size="14" font-weight="bold">云存储</text>
  <text x="650" y="205" text-anchor="middle" fill="#888" font-family="Arial, sans-serif" font-size="12">多种云存储支持</text>
  <text x="650" y="220" text-anchor="middle" fill="#888" font-family="Arial, sans-serif" font-size="12">阿里云、腾讯云等</text>
  
  <!-- Status badge -->
  <rect x="650" y="310" width="100" height="30" fill="#10b981" rx="15"/>
  <text x="700" y="330" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="bold">稳定版</text>
  
  <!-- Decorative elements -->
  <circle cx="100" cy="320" r="20" fill="none" stroke="#00ff88" stroke-width="2" opacity="0.5"/>
  <circle cx="150" cy="340" r="15" fill="none" stroke="#00ff88" stroke-width="1" opacity="0.3"/>
  <circle cx="200" cy="320" r="10" fill="none" stroke="#00ff88" stroke-width="1" opacity="0.2"/>
</svg>