<svg width="800" height="400" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="400" fill="#0a0a0a"/>
  
  <!-- Animated grid pattern -->
  <defs>
    <pattern id="grid2" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#00d4ff" stroke-width="0.5" opacity="0.3"/>
    </pattern>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ff0080;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00ff88;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#grid2)"/>
  
  <!-- Title area with gradient -->
  <rect x="50" y="50" width="700" height="80" fill="#1a1a1a" stroke="url(#titleGrad)" stroke-width="2" rx="8"/>
  <text x="400" y="100" text-anchor="middle" fill="url(#titleGrad)" font-family="Arial, sans-serif" font-size="32" font-weight="bold">PixelPunk v2.0.0-beta</text>
  
  <!-- Feature boxes with modern design -->
  <rect x="50" y="160" width="150" height="80" fill="#1a1a1a" stroke="#00d4ff" stroke-width="1" rx="4"/>
  <text x="125" y="180" text-anchor="middle" fill="#00d4ff" font-family="Arial, sans-serif" font-size="13" font-weight="bold">全新 UI</text>
  <text x="125" y="200" text-anchor="middle" fill="#888" font-family="Arial, sans-serif" font-size="11">现代化设计</text>
  <text x="125" y="215" text-anchor="middle" fill="#888" font-family="Arial, sans-serif" font-size="11">交互体验</text>
  
  <rect x="220" y="160" width="150" height="80" fill="#1a1a1a" stroke="#ff0080" stroke-width="1" rx="4"/>
  <text x="295" y="180" text-anchor="middle" fill="#ff0080" font-family="Arial, sans-serif" font-size="13" font-weight="bold">GPT-4 Vision</text>
  <text x="295" y="200" text-anchor="middle" fill="#888" font-family="Arial, sans-serif" font-size="11">增强 AI 分析</text>
  <text x="295" y="215" text-anchor="middle" fill="#888" font-family="Arial, sans-serif" font-size="11">智能识别</text>
  
  <rect x="390" y="160" width="150" height="80" fill="#1a1a1a" stroke="#00ff88" stroke-width="1" rx="4"/>
  <text x="465" y="180" text-anchor="middle" fill="#00ff88" font-family="Arial, sans-serif" font-size="13" font-weight="bold">实时处理</text>
  <text x="465" y="200" text-anchor="middle" fill="#888" font-family="Arial, sans-serif" font-size="11">图片滤镜</text>
  <text x="465" y="215" text-anchor="middle" fill="#888" font-family="Arial, sans-serif" font-size="11">动态效果</text>
  
  <rect x="560" y="160" width="150" height="80" fill="#1a1a1a" stroke="#00d4ff" stroke-width="1" rx="4"/>
  <text x="635" y="180" text-anchor="middle" fill="#00d4ff" font-family="Arial, sans-serif" font-size="13" font-weight="bold">团队协作</text>
  <text x="635" y="200" text-anchor="middle" fill="#888" font-family="Arial, sans-serif" font-size="11">多人协同</text>
  <text x="635" y="215" text-anchor="middle" fill="#888" font-family="Arial, sans-serif" font-size="11">实时更新</text>
  
  <!-- PWA indicator -->
  <rect x="50" y="260" width="200" height="60" fill="#1a1a1a" stroke="#ff0080" stroke-width="1" rx="4"/>
  <text x="150" y="280" text-anchor="middle" fill="#ff0080" font-family="Arial, sans-serif" font-size="12" font-weight="bold">PWA 支持</text>
  <text x="150" y="300" text-anchor="middle" fill="#888" font-family="Arial, sans-serif" font-size="10">Progressive Web App</text>
  
  <!-- GraphQL indicator -->
  <rect x="270" y="260" width="200" height="60" fill="#1a1a1a" stroke="#00ff88" stroke-width="1" rx="4"/>
  <text x="370" y="280" text-anchor="middle" fill="#00ff88" font-family="Arial, sans-serif" font-size="12" font-weight="bold">GraphQL API</text>
  <text x="370" y="300" text-anchor="middle" fill="#888" font-family="Arial, sans-serif" font-size="10">现代化接口</text>
  
  <!-- Status badge -->
  <rect x="620" y="310" width="120" height="30" fill="#f59e0b" rx="15"/>
  <text x="680" y="330" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="bold">开发版</text>
  
  <!-- Decorative cyber elements -->
  <polygon points="100,340 120,360 80,360" fill="none" stroke="#00d4ff" stroke-width="2" opacity="0.5"/>
  <polygon points="150,350 170,370 130,370" fill="none" stroke="#ff0080" stroke-width="1" opacity="0.4"/>
  <polygon points="200,340 220,360 180,360" fill="none" stroke="#00ff88" stroke-width="1" opacity="0.3"/>
  
  <!-- Warning indicator for beta -->
  <rect x="500" y="320" width="80" height="20" fill="#f59e0b" rx="10" opacity="0.8"/>
  <text x="540" y="334" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10" font-weight="bold">⚠️ BETA</text>
</svg>